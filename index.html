<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mama & Papa op (huwelijks)reis</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
}

.card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);
    text-align:center;
}

h1{
    color:#004a99;
}

.time{
    font-size:48px;
    font-weight:bold;
    color:#0066cc;
}

.location{
    font-size:28px;
    margin-bottom:15px;
}

.box{
    margin:15px 0;
    padding:15px;
    background:#f0f4f8;
    border-radius:12px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.admin{
    display:none;
    margin-top:20px;
    text-align:left;
}

.admin input,
.admin textarea{
    width:100%;
    padding:8px;
    margin-bottom:10px;
}

.polarsteps{
    display:inline-block;
    margin-top:15px;
    background:#2aa745;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="card">

<h1>💍 Mama & Papa op (huwelijks)reis</h1>

<div class="location" id="location"></div>

<div class="box">
<h3>🕒 Bij mama & papa</h3>
<div class="time" id="localTime"></div>
</div>

<div class="box">
<h3>🇧🇪 In België</h3>
<div class="time" id="belgiumTime"></div>
</div>

<div class="box" id="daynight"></div>

<div class="box">
<h3>📞 Kunnen jullie ons bellen?</h3>
<div id="status"></div>
</div>


<div class="box">
<h3>💬 Bericht van vandaag</h3>
<div id="message"></div>
</div>

<a class="polarsteps"
   id="polarstepsBtn"
   target="_blank">
📸 Volg onze reis op Polarsteps
</a>

<br><br>

<a class="polarsteps"
   id="familyChatBtn"
   href="https://chat.google.com/app/chat/AAQAQa5aWZs"
   target="_blank"
   style="background:#4285F4;">
💬 Open onze gezins CHAT
</a>
    
<br><br>

<button onclick="toggleAdmin()">⚙️ Instellingen voor mama & papa</button>

<div class="admin" id="adminPanel">

    <h2>Instellingen</h2>

<br><br>
    
    <label>Bereikbaarheid</label>

    <select id="statusInput">
        <option value="AUTO">Automatisch bepalen</option>
        <option value="BELLEN">✅ Bereikbaar</option>
        <option value="ONDERWEG">⚠️ Onderweg</option>
        <option value="SLAPEN">😴 Slapen</option>
        <option value="CUSTOM">✏️ Eigen bericht</option>
    </select>
    
    <br><br>
    
    <input
        id="customStatusInput"
        placeholder="Eigen boodschap"
        style="display:none;"
    >

    <label>Bericht van vandaag</label>
    <textarea id="messageInput" rows="4"></textarea>

    <button class="saveBtn" onclick="saveData()">
        Opslaan
    </button>

</div>

</div>

<script>

const defaultData = {
 location:"Denver, Colorado",
 timezone:"America/Denver",
 status:"🟢 Bereikbaar",
 message:"Vandaag zijn we aangekomen!",
 polarsteps:"https://www.polarsteps.com/Serelinda/23645002-united-states?s=d2fb13cc-0457-425a-9668-d75526680ae3"
};

function setAutomaticLocation() {

    const today = new Date();

    const day = today.getDate();
    const month = today.getMonth() + 1;
    const year = today.getFullYear();

if(year !== 2026 || month !== 9){

    tripData.location = "🏠 Thuis in België";
    tripData.timezone = "Europe/Brussels";

    return;
}


    // Colorado
    if(day >= 2 && day <= 3){
        tripData.location = "🏠 Denver, Colorado";
        tripData.timezone = "America/Denver";
    }

    // Moab
    else if(day === 4){
        tripData.location = "🏜️ Moab (Arches NP)";
        tripData.timezone = "America/Denver";
    }

    // Monument Valley
    else if(day === 5){
        tripData.location = "🐎 Monument Valley";
        tripData.timezone = "America/Denver";
    }

    // Page
    else if(day === 6){
        tripData.location = "📸 Page (Antelope Canyon)";
        tripData.timezone = "America/Phoenix";
    }

    // Bryce
    else if(day === 7){
        tripData.location = "🌄 Bryce Canyon";
        tripData.timezone = "America/Denver";
    }

    // Zion
    else if(day === 8){
        tripData.location = "🥾 Zion National Park";
        tripData.timezone = "America/Denver";
    }

    // Vegas
    else if(day === 9){
        tripData.location = "🎰 Las Vegas";
        tripData.timezone = "America/Los_Angeles";
    }

    // Death Valley
    else if(day === 10){
        tripData.location = "🌵 Death Valley";
        tripData.timezone = "America/Los_Angeles";
    }

    // Anaheim
    else if(day >= 11 && day <= 13){
        tripData.location = "🎮 Anaheim (BlizzCon)";
        tripData.timezone = "America/Los_Angeles";
    }

    // Oahu
    else if(day >= 14 && day <= 15){
        tripData.location = "🌺 Honolulu (Oahu)";
        tripData.timezone = "Pacific/Honolulu";
    }

    // Volcanoes NP
    else if(day >= 16 && day <= 17){
        tripData.location = "🌋 Volcanoes National Park";
        tripData.timezone = "Pacific/Honolulu";
    }

    // Kona
    else if(day >= 18 && day <= 19){
        tripData.location = "🐠 Kailua-Kona";
        tripData.timezone = "Pacific/Honolulu";
    }

    // Maui
    else if(day >= 20 && day <= 23){
        tripData.location = "🏖️ Kihei (Maui)";
        tripData.timezone = "Pacific/Honolulu";
    }

    // Terugreis
    else if(day >= 24 && day <= 25){
        tripData.location = "✈️ Terugvlucht naar België";
        tripData.timezone = "America/Denver";
    }
}
    
function getCurrentStatus() {

    const hour = parseInt(
        new Date().toLocaleString(
            "en-US",
            {
                timeZone: tripData.timezone,
                hour: "numeric",
                hour12: false
            }
        )
    );

    // Eigen bericht heeft absolute voorrang
    if(tripData.statusMode === "CUSTOM"){
        return tripData.customStatus;
    }

    // Automatisch slapen
if(hour >= 23 || hour < 7){
    return "😴 Nee, wij slapen nu. Je mag wel altijd een CHAT sturen 💬";
}

    // Automatische modus
    if(tripData.statusMode === "AUTO"){

        if(hour < 9){
            return "☕ We zijn net wakker";
        }

        if(hour < 18){
            return "✅ Ja, waarschijnlijk wel";
        }

        return "⚠️ Misschien, we zijn waarschijnlijk op uitstap";
    }

    switch(tripData.statusMode){

        case "BELLEN":
            return "✅ Ja, jullie mogen ons gerust bellen";

        case "ONDERWEG":
            return "⚠️ Misschien, we zijn onderweg";

        case "SLAPEN":
            return "😴 Nee, wij slapen nu. Je mag wel altijd een CHAT sturen 💬";

        default:
            return "✅ Ja, waarschijnlijk wel";
    }
}
    
let tripData =
JSON.parse(localStorage.getItem("tripData"))
|| defaultData;

    
function toggleCustomStatusField(){

    const show =
    document.getElementById("statusInput").value === "CUSTOM";

    document.getElementById("customStatusInput").style.display =
    show ? "block" : "none";
}

document
.getElementById("statusInput")
.addEventListener("change", toggleCustomStatusField);

    

function render(){

    setAutomaticLocation();

    document.getElementById("location").innerText =
    tripData.location;

    document.getElementById("status").innerText =
    getCurrentStatus();

    document.getElementById("message").innerText =
    tripData.message;

    document.getElementById("polarstepsBtn").href =
    tripData.polarsteps;
}

function updateClock(){
 
    setAutomaticLocation();
 const local =
 new Date().toLocaleTimeString(
 "nl-BE",
 {
  timeZone:tripData.timezone,
  hour:"2-digit",
  minute:"2-digit"
 });

 const belgium =
 new Date().toLocaleTimeString(
 "nl-BE",
 {
  timeZone:"Europe/Brussels",
  hour:"2-digit",
  minute:"2-digit"
 });

 document.getElementById("localTime").innerText =
 local;

 document.getElementById("belgiumTime").innerText =
 belgium;

 const hour =
 parseInt(
 new Date().toLocaleString(
 "en-US",
 {
  timeZone:tripData.timezone,
  hour:"numeric",
  hour12:false
 }).split(",")[1]
 );

 document.getElementById("daynight").innerHTML =
 (hour>=6 && hour<20)
 ?
 "☀️ Het is dag bij mama & papa"
 :
 "🌙 Mama & papa slapen waarschijnlijk";

}

function toggleAdmin(){

 const panel =
 document.getElementById("adminPanel");

 panel.style.display =
 panel.style.display==="block"
 ? "none"
 : "block";

document.getElementById("statusInput").value =
tripData.statusMode || "AUTO";

document.getElementById("customStatusInput").value =
tripData.customStatus || "";

document.getElementById("statusInput")
.addEventListener("change", function(){

    document.getElementById("customStatusInput").style.display =
        this.value === "CUSTOM"
        ? "block"
        : "none";

});
    
document.getElementById("messageInput").value =
tripData.message;

toggleCustomStatusField();
}

   
function saveData(){

tripData.statusMode =
document.getElementById("statusInput").value;

tripData.customStatus =
document.getElementById("customStatusInput").value;


 tripData.message =
 document.getElementById("messageInput").value;

 localStorage.setItem(
 "tripData",
 JSON.stringify(tripData)
 );

 render();

 alert("Opgeslagen!");
}

render();
updateClock();
function hideChatButtonOnMobile() {

    const isMobile =
        /Android|iPhone|iPad|iPod|Mobile/i.test(
            navigator.userAgent
        );

    if(isMobile){
        document.getElementById("familyChatBtn").style.display = "none";
    }
}

hideChatButtonOnMobile();
    
setInterval(() => {
    updateClock();
    document.getElementById("status").innerText =
        getCurrentStatus();
}, 1000);

</script>

</body>
</html>
